<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="t d">
  <title id="t">Invest+ —— AI 金融研究助手</title>
  <desc id="d">一个面向美股的自主研究 Agent。右侧面板展示只增不改的轨迹：静态前缀、用户问题，之后每轮追加一行，直到模型不再发起工具调用为止。</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="26" fill="#fafaf9" stroke="#e8e6e1"/>

  <!-- ── 左：身份 ── -->
  <g transform="translate(64 0)">
    <text class="mono" x="0" y="84" font-size="20" letter-spacing="2.6" fill="#75726c">AI AGENT · 美股研究</text>

    <!-- 标记：取自 logo.svg 的上升折线，收尾于一个加号 -->
    <g transform="translate(0 116)">
      <path d="M 2 44 L 20 26 L 32 38 L 53 17" fill="none" stroke="url(#brand)"
            stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 60 13 L 74 13 M 67 6 L 67 20" fill="none" stroke="#10B981"
            stroke-width="5" stroke-linecap="round"/>
    </g>

    <text class="sans" x="92" y="168" font-size="60" font-weight="700" fill="#1c1b1a">Invest<tspan fill="url(#brand)">+</tspan></text>

    <text class="sans" x="0" y="222" font-size="25" fill="#1c1b1a">用中文或英文问它一支美股。查什么、</text>
    <text class="sans" x="0" y="256" font-size="25" fill="#1c1b1a">什么时候算查够了，它自己判断。</text>

    <line x1="0" y1="290" x2="56" y2="290" stroke="#d6d3cc" stroke-width="2"/>
    <text class="sans" x="0" y="324" font-size="20" fill="#6b6862">手写循环 · 不依赖任何 Agent 框架</text>
  </g>

  <!-- ── 右：只增不改的轨迹 ── -->
  <g transform="translate(636 40)">
    <rect x="0.5" y="0.5" width="499" height="279" rx="14" fill="#ffffff" stroke="#e8e6e1"/>
    <text class="sans" x="24" y="40" font-size="18" letter-spacing="1.8" fill="#75726c">只增不改的轨迹</text>
    <line x1="24" y1="56" x2="475" y2="56" stroke="#e8e6e1" stroke-width="1"/>

    <line x1="36" y1="76" x2="36" y2="252" stroke="#e8e6e1" stroke-width="2"/>

    <g class="mono" font-size="20">
      <circle cx="36" cy="84" r="4" fill="#d6d3cc"/>
      <rect x="52" y="68" width="420" height="32" rx="8" fill="#f5f4f1"/>
      <text x="68" y="90" fill="#6b6862">system prefix + tools</text>

      <circle cx="36" cy="128" r="4" fill="#d6d3cc"/>
      <rect x="52" y="112" width="420" height="32" rx="8" fill="#f5f4f1"/>
      <text x="68" y="134" fill="#6b6862">user · "AAPL 10-K 风险"</text>

      <circle cx="36" cy="172" r="4" fill="#d6d3cc"/>
      <rect x="52" y="156" width="420" height="32" rx="8" fill="#f0eeea"/>
      <text x="68" y="178" fill="#1c1b1a">assistant · tool_calls</text>

      <circle cx="36" cy="216" r="4" fill="#d6d3cc"/>
      <rect x="52" y="200" width="420" height="32" rx="8" fill="#f0eeea"/>
      <text x="68" y="222" fill="#1c1b1a">tool · rag_search result</text>

      <circle cx="36" cy="260" r="4" fill="#35322e"/>
      <rect x="52" y="244" width="420" height="32" rx="8" fill="#35322e"/>
      <text x="68" y="266" fill="#ffffff">assistant · no tool_calls</text>
      <text class="sans" x="456" y="266" fill="#ffffff" text-anchor="end" font-size="18" opacity="0.85">停止</text>
    </g>
  </g>
</svg>
