services:
  es01:
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  pg:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: investplus-backend-local
    env_file: .env
    # Overrides whatever ES_URL/DATABASE_URL a native (non-docker) local dev setup
    # keeps in .env (typically localhost-based) — inside this compose network the
    # backend container must reach es01/pg by service name, not localhost.
    environment:
      - ES_URL=http://es01:9200
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@pg:5432/investplus
      - FRONTEND_ORIGIN=http://localhost:8080
    volumes:
      - uploads_data:/srv/investplus/storage
    depends_on:
      es01:
        condition: service_healthy
      pg:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: investplus-frontend-local
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: investplus-gateway-local
    volumes:
      - ./gateway/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/htpasswd:/etc/nginx/htpasswd:ro
    # 8080 instead of 80: no sudo/root needed on a dev laptop, and avoids clashing
    # with anything already bound to 80/443 locally. No TLS, no certbot service.
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads_data:
