# 前端静态容器的 nginx 配置。
#
# 存在的唯一理由是 SPA fallback。此前这个镜像用的是 nginx:alpine 的默认配置，
# 没有 try_files，于是任何直接访问或刷新非根路由的请求都由 nginx 直接返回 404：
#
#   实测（修复前，生产域名）：
#     /                       200
#     /repository             404
#     /chat/<session_id>      404
#
# 请求根本没进到 React，所以 src/pages/404.tsx 救不了 —— 它只处理客户端路由。
# 本地 npm run dev 之所以从未暴露这个问题，是因为 Vite 自带 SPA fallback，
# 这是一个纯粹的 dev/prod 分歧。

server {
    # IPv6 这条不能省。容器 /etc/hosts 里 `::1 localhost` 是存在的，而
    # frontend/Dockerfile 的 HEALTHCHECK 用的是 `wget http://localhost:80/`,
    # busybox wget 会走 ::1 —— 只监听 IPv4 的话它直接 Connection refused，
    # 容器被判 unhealthy；而 docker-compose.prod.yml 里 gateway 有
    # `depends_on: frontend: condition: service_healthy`，于是网关永远不启动，
    # 80/443 无人监听，整站打不开。
    #
    # nginx 官方镜像自带的 default.conf 本来就同时写了这两条，本文件替换掉它时
    # 必须保持同样的监听面。（同类坑在 gateway 的 healthcheck 上已记录过一次。）
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 带内容哈希的构建产物（index-a1b2c3d4.js 之类）可以长期缓存 —— 内容变了
    # 文件名就变了，不存在取到旧版本的可能。
    # 注：这里只用 add_header，不用 `expires 1y` —— expires 指令自己也会发一个
    # Cache-Control，两条同名响应头会一起发出去（实测确认），对中间代理是歧义。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 必须不缓存。它引用的是带哈希的资源名，一旦浏览器拿到旧的
    # index.html，就会去请求上一次部署的资源文件 —— 而那些文件在部署时已被
    # 新产物替换，结果是白屏。这一条和 try_files 是配套的：没有它，fallback
    # 会稳定地把陈旧的 index.html 发出去。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback 本体：先按真实文件找，再按目录找，都没有就交给 index.html
    # 由 react-router 接管。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
