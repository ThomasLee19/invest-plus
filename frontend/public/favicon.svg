<!--
  浏览器实际加载的 favicon —— index.html 的 <link rel="icon" href="/favicon.svg">
  指向本文件。（src/assets/favicon.svg 是零引用孤儿，已删除。）

  色值必须硬编码：<img>/<link> 加载的 SVG 处于独立文档上下文，读不到宿主页面
  :root 上的 CSS 自定义属性。在这里写 var(--accent) 会解析失败并渲染成黑色或
  不可见，且不报任何错误。取值镜像自 src/styles/tokens.css：
    --accent          #0f6b6b
    --gradient-brand  #0f6b6b → #2e9e8f
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F6B6B" />
      <stop offset="100%" stop-color="#2E9E8F" />
    </linearGradient>
  </defs>

  <!-- 原先整组套了一层 feDropShadow。暖白克制的设计语言里几乎不用阴影，
       且 16px 标签页图标上的投影只会糊掉边缘，已移除。 -->
  <g>
    <path d="M 14 74
             L 35 49
             L 49 63
             L 72 35"
          fill="none"
          stroke="url(#iconGradient)"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <path d="M 80 21 L 92 21"
          fill="none"
          stroke="#0F6B6B"
          stroke-width="6.5"
          stroke-linecap="round" />
    <path d="M 86 15 L 86 27"
          fill="none"
          stroke="#0F6B6B"
          stroke-width="6.5"
          stroke-linecap="round" />
  </g>
</svg>
