<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />   <stop offset="100%" stop-color="#10B981" /> </linearGradient>
    
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <path d="M 15 60 
             L 38 37 
             L 53 52 
             L 80 25" 
          fill="none" 
          stroke="url(#lineGradient)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <path d="M 89 20 L 103 20" 
          fill="none" 
          stroke="#10B981" 
          stroke-width="5" 
          stroke-linecap="round" />
    <path d="M 96 13 L 96 27" 
          fill="none" 
          stroke="#10B981" 
          stroke-width="5" 
          stroke-linecap="round" />
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#334155" letter-spacing="0.5">
    <text x="118" y="52" font-size="30" font-weight="800">Invest</text>
    
    <text x="212" y="52" font-size="30" font-weight="400">Plus</text>
