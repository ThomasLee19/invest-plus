<!--
  header-bar 的横版 wordmark（图标 + "InvestPlus" 字样）。

  色值必须硬编码：header-bar/index.tsx 用 <img src={logo}> 加载，<img> 引入的
  SVG 处于独立文档上下文，读不到宿主页面 :root 上的 CSS 自定义属性。写
  var(--accent) 会解析失败并渲染成黑色或不可见，且不报任何错误。
  取值镜像自 src/styles/tokens.css：
    --accent          #0f6b6b
    --gradient-brand  #0f6b6b → #2e9e8f
    --text-primary    #1c1b1a
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="lineGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F6B6B" />
      <stop offset="100%" stop-color="#2E9E8F" />
    </linearGradient>
  </defs>

  <!-- 原先整组套了一层 feDropShadow。与「几乎无阴影、靠边框和留白分层」的
       设计语言冲突，已移除。 -->
  <g>
    <path d="M 15 60
             L 38 37
             L 53 52
             L 80 25"
          fill="none"
          stroke="url(#lineGradient)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <path d="M 89 20 L 103 20"
          fill="none"
          stroke="#0F6B6B"
          stroke-width="5"
          stroke-linecap="round" />
    <path d="M 96 13 L 96 27"
          fill="none"
          stroke="#0F6B6B"
          stroke-width="5"
          stroke-linecap="round" />
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#1C1B1A" letter-spacing="0.5">
    <text x="118" y="52" font-size="30" font-weight="800">Invest</text>

    <text x="212" y="52" font-size="30" font-weight="400">Plus</text>
  </g>
</svg>
