# http 级指令，必须在最外层，不能嵌进 server{}
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
# nginx 对 limit_req 触发默认返回 503（语义是"服务不可用"），实测会让客户端/监控
# 误判成服务挂了；限流场景标准语义是 429（Too Many Requests，明确告诉客户端可重试）。
limit_req_status 429;

# :80 只做两件事——续期用的 ACME challenge，和把其余流量强制跳转 HTTPS
server {
    listen 80;
    server_name investplus-agent.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name investplus-agent.com;

    ssl_certificate     /etc/letsencrypt/live/investplus-agent.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/investplus-agent.com/privkey.pem;

    # Docker 内嵌 DNS，配合下面的变量写法让 proxy_pass 延迟到请求时解析，而不是
    # nginx 进程启动时一次性解析并缓存 IP。否则：只重新部署 backend（镜像更新但
    # gateway 镜像未变）时，`docker compose up -d` 只会重建 backend 容器换新 IP，
    # gateway 容器不会被重建、nginx worker 里还缓存着旧 IP，网关会悄悄指向一个
    # 已经不存在的容器，直到有人手动 reload/restart gateway 才恢复。
    resolver 127.0.0.11 valid=10s;

    # API：显式剥离 /ai-search 前缀，等价于 dev 环境 vite.config.ts 的 rewrite 规则
    # 原因：frontend/.env 里 VITE_API_BASE=/ai-search 是构建期烘死的前缀，
    # backend 路由本身不带这个前缀（app_main.py 的 include_router 无 prefix 参数），
    # 照字面"反代到 backend:8000"而不剥前缀，会导致全部 API 请求 404。
    # 注意：proxy_pass 目标一旦含变量（上面 resolver 修复的副作用），nginx 原本
    # "用 proxy_pass 的 URI 部分替换 location 匹配前缀" 的自动剥离机制就会失效，
    # 请求会带着完整的 /ai-search/xxx 原样转发给 backend，导致全部 404。
    # 因此改为显式 rewrite 剥前缀，再用不带 URI 部分的 proxy_pass 转发被改写后的 URI。
    location /ai-search/ {
        # set 必须写在 rewrite ... break 之前：break 会终止该 location 内后续
        # rewrite 模块指令（含 set）的处理，写反了 $backend_upstream 会一直是
        # uninitialized，导致 proxy_pass 拿到空字符串报 "invalid URL prefix"。
        set $backend_upstream backend:8000;
        rewrite ^/ai-search/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 直通（聊天流式响应必须不被缓冲）：
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        limit_req zone=api_limit burst=10 nodelay;   # 引用上面 http 级声明的 zone
    }

    # 健康检查：供 docker healthcheck / compose depends_on 探活
    location = /health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/health;
    }

    # 前端静态（SPA 根路径）
    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
    }
}
# ============================================================================
# letsgothomas.me — 第一阶段（证书签发前）
# 粘贴到 Invest+ 仓库 gateway/nginx.conf 文件末尾（现有 investplus-agent.com 两个 server 之后）。
# 只做两件事：给 certbot 的 ACME 校验开路；其余流量 301 到 https 裸域。
# 证书签好、第二阶段块加入后，这个块原样保留（80 端口永远只做校验 + 跳转）。
# ============================================================================
server {
    listen 80;
    server_name letsgothomas.me www.letsgothomas.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://letsgothomas.me$request_uri;
    }
}
# ============================================================================
# letsgothomas.me — 第二阶段（证书已在 /etc/letsencrypt/live/letsgothomas.me/）
# 粘贴到 Invest+ 仓库 gateway/nginx.conf 文件末尾（第一阶段块之后）。
# 静态文件来自宿主机 /opt/who-is-thomas/dist，经 docker-compose.prod.yml 只读挂载为 /var/www/letsgothomas。
# ============================================================================

# www → 裸域（同一张证书含两个域名）
server {
    listen 443 ssl;
    http2 on;
    server_name www.letsgothomas.me;

    ssl_certificate     /etc/letsencrypt/live/letsgothomas.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letsgothomas.me/privkey.pem;

    return 301 https://letsgothomas.me$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name letsgothomas.me;

    ssl_certificate     /etc/letsencrypt/live/letsgothomas.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letsgothomas.me/privkey.pem;

    root  /var/www/letsgothomas;
    index index.html;

    # Astro build.format = 'file'：/projects → /projects.html，目录 → index.html，其余 404
    try_files $uri $uri.html $uri/ =404;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Astro 产物带内容哈希：长缓存
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # 自托管字体也带哈希后缀 / 极少改：长缓存
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # HTML 每次校验，保证发布后立刻生效
    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
