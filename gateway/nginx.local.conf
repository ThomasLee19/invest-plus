# 本地开发变体：仅 HTTP，不含 TLS/ACME 相关内容
# 生产版本见 nginx.conf（证书路径在本地机器上不存在，nginx -t 会失败）
# http 级指令，必须在最外层，不能嵌进 server{}
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/m;
# nginx 对 limit_req 触发默认返回 503（语义是"服务不可用"），实测会让客户端/监控
# 误判成服务挂了；限流场景标准语义是 429（Too Many Requests，明确告诉客户端可重试）。
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # Docker 内嵌 DNS，配合下面的变量写法让 proxy_pass 延迟到请求时解析，
    # 而不是配置加载时立即解析——否则单独用 `docker run ... nginx -t`
    # （不在 compose 网络里，backend/frontend 容器名不可解析）会直接报
    # "host not found in upstream"，即使配置本身语法完全正确。
    resolver 127.0.0.11 valid=10s;

    # API：显式剥离 /ai-search 前缀，等价于 dev 环境 vite.config.ts 的 rewrite 规则
    # 注意：proxy_pass 目标一旦含变量（上面 resolver 修复的副作用），nginx 原本
    # "用 proxy_pass 的 URI 部分替换 location 匹配前缀" 的自动剥离机制就会失效，
    # 请求会带着完整的 /ai-search/xxx 原样转发给 backend，导致全部 404。
    # 因此改为显式 rewrite 剥前缀，再用不带 URI 部分的 proxy_pass 转发被改写后的 URI。
    location /ai-search/ {
        # set 必须写在 rewrite ... break 之前：break 会终止该 location 内后续
        # rewrite 模块指令（含 set）的处理，写反了 $backend_upstream 会一直是
        # uninitialized，导致 proxy_pass 拿到空字符串报 "invalid URL prefix"。
        set $backend_upstream backend:8000;
        rewrite ^/ai-search/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SSE 直通（聊天流式响应必须不被缓冲）：
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
        auth_basic "invest-plus demo";
        auth_basic_user_file /etc/nginx/htpasswd;
        limit_req zone=api_limit burst=10 nodelay;   # 引用上面 http 级声明的 zone
    }

    # 健康检查：不挂密码门，供 docker healthcheck / compose depends_on 探活
    location = /health {
        auth_basic off;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/health;
    }

    # 前端静态（SPA 根路径）
    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        auth_basic "invest-plus demo";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}
